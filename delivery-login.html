<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delivery Login • Pathology</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Outfit',sans-serif;
  background:#0F172A;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  color:white;
}
.container{
  width:320px;
  padding:30px;
  background:rgba(255,255,255,0.05);
  border-radius:20px;
}
h2{margin-bottom:20px;}
input{
  width:100%;
  padding:12px;
  margin-bottom:15px;
  border:none;
  border-radius:10px;
}
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,#11998e,#38ef7d);
  color:white;
  font-weight:bold;
  cursor:pointer;
}
a{color:#38BDF8;font-size:12px;text-decoration:none;}
</style>
</head>

<body>

<div class="container">
  <h2>Report Delivery Login</h2>
  <input type="email" id="dEmail" placeholder="Email Address">
  <input type="password" id="dPass" placeholder="Password">
  <button onclick="login()">Login</button>
  <br><br>
  <a href="index.html">← Back to Select Role</a>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyByOYHIq9KdftTw7-VS4DdHXxbm6bh1Ajg",
    authDomain: "pathology-f19ed.firebaseapp.com",
    projectId: "pathology-f19ed",
    storageBucket: "pathology-f19ed.firebasestorage.app",
    messagingSenderId: "312449114398",
    appId: "1:312449114398:web:e52fdc316fdf9c0552690f"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  window.login = async function() {
    const email = document.getElementById('dEmail').value;
    const pass = document.getElementById('dPass').value;

    if(!email || !pass) {
        alert("Please enter Email and Password");
        return;
    }

    try {
        // Authenticate using Firebase Auth service
        const userCredential = await signInWithEmailAndPassword(auth, email, pass);
        const user = userCredential.user;

        // Save session and redirect
        sessionStorage.setItem('deliveryUser', JSON.stringify({ email: user.email, uid: user.uid }));
        window.location.href = "delivery-dashboard.html";

    } catch(error) {
        console.error("Login Error:", error.code, error.message);
        alert("Invalid Email or Password! Ensure 'Email/Password' is enabled in the Firebase Auth 'Sign-in method' tab.");
    }
  }
</script>

</body>
</html>
