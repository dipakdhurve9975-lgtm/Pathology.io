<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PATHOLOGY • Select Role</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: 'Outfit', sans-serif;
      background: #0F172A;
      color: white;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .bg-gradient {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at top right, #3B82F6 0%, transparent 40%),
        radial-gradient(circle at bottom left, #10B981 0%, transparent 40%);
      opacity: 0.2;
      z-index: -1;
    }

    h1 {
      font-size: 36px;
      font-weight: 900;
      margin-bottom: 10px;
    }

    p {
      color: #94A3B8;
      margin-bottom: 40px;
      font-size: 16px;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 15px;
      cursor: pointer;
      transition: 0.2s;
      backdrop-filter: blur(10px);
    }

    .card:active {
      transform: scale(0.96);
      background: rgba(255, 255, 255, 0.1);
    }

    .icon-box {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
    }

    .c-patient { background: linear-gradient(135deg, #FF512F, #DD2476); }
    .c-delivery { background: linear-gradient(135deg, #11998e, #38ef7d); }
    .c-admin { background: #333; }

    .title { font-weight: 700; font-size: 18px; display: block; }
    .sub { font-size: 12px; color: #94A3B8; }
  </style>
</head>

<body>
  <div class="bg-gradient"></div>

  <div style="flex:1; display:flex; flex-direction:column; justify-content:center;">
    <h1>Select<br>Role</h1>
    <p>Choose your role to continue.</p>

    <!-- Patient -->
    <div class="card" onclick="go('patient')">
      <div class="icon-box c-patient">
        <i class='bx bxs-user'></i>
      </div>
      <div>
        <span class="title">Patient</span>
        <span class="sub">View & Download Reports</span>
      </div>
      <i class='bx bx-chevron-right' style="margin-left:auto; font-size:24px; color:#666;"></i>
    </div>

    <!-- Report Delivery Boy -->
    <div class="card" onclick="go('delivery')">
      <div class="icon-box c-delivery">
        <i class='bx bxs-truck'></i>
      </div>
      <div>
        <span class="title">Report Delivery Boy</span>
        <span class="sub">Deliver reports to patients</span>
      </div>
      <i class='bx bx-chevron-right' style="margin-left:auto; font-size:24px; color:#666;"></i>
    </div>

    <!-- Admin -->
    <div class="card" onclick="go('admin')" style="margin-top:20px;">
      <div class="icon-box c-admin">
        <i class='bx bxs-lock-alt'></i>
      </div>
      <div>
        <span class="title">Admin</span>
        <span class="sub">Lab Management Access</span>
      </div>
    </div>

  </div>

  <div style="text-align:center; font-size:12px; color:#666; margin-top:20px;">
    Pathology System v1.0 • Made with ❤️
  </div>

  <script>
    function go(role) {

      if (role === 'patient') {
        window.location.href = 'patient-login.html';
      }

      else if (role === 'delivery') {
        window.location.href = 'delivery-login.html';
      }

      else if (role === 'admin') {
        window.location.href = 'admin-login.html';
      }

    }
  </script>

</body>
</html>
