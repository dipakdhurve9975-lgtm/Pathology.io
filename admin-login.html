<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login • Pathology</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Outfit',sans-serif;
  background:#0F172A;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  color:white;
}
.container{
  width:350px;
  padding:30px;
  background:rgba(255,255,255,0.05);
  border-radius:20px;
  backdrop-filter:blur(10px);
}
h2{
  margin-bottom:20px;
  font-weight:700;
}
input{
  width:100%;
  padding:12px;
  margin-bottom:15px;
  border:none;
  border-radius:10px;
  outline:none;
}
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#3B82F6;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
button:hover{
  opacity:0.9;
}
a{
  color:#38BDF8;
  font-size:12px;
  text-decoration:none;
}
@media(max-width:480px){
  .container{width:90%;}
}
</style>
</head>

<body>

<div class="container">
  <h2>Admin Login</h2>

  <input type="email" id="adminEmail" placeholder="Enter Admin Email">

  <input type="password" id="adminPass" placeholder="Enter Password">

  <button onclick="login()">Login</button>

  <br><br>
  <a href="index.html">← Back to Select Role</a>
</div>

<script type="module">
// 1. Import Firebase Auth
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

// 2. Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyByOYHIq9KdftTw7-VS4DdHXxbm6bh1Ajg",
  authDomain: "pathology-f19ed.firebaseapp.com",
  projectId: "pathology-f19ed",
  storageBucket: "pathology-f19ed.firebasestorage.app",
  messagingSenderId: "312449114398",
  appId: "1:312449114398:web:e52fdc316fdf9c0552690f"
};

// 3. Initialize Firebase Auth
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// 4. Admin Login Logic
window.login = async function() {
  const email = document.getElementById('adminEmail').value;
  const pass  = document.getElementById('adminPass').value;

  if(!email || !pass) {
    alert("Please enter both Admin Email and Password");
    return;
  }

  try {
    // Authenticate with Firebase Authentication
    const userCredential = await signInWithEmailAndPassword(auth, email, pass);
    
    // Save session flag for the dashboard
    sessionStorage.setItem('adminUser', "true"); 
    
    // Redirect to Admin Dashboard
    window.location.href = "admin-dashboard.html";

  } catch(error) {
    console.error("Admin Login Error:", error.code);
    alert("Invalid Email or Password! Ensure the account exists in the Firebase Authentication console.");
  }
}
</script>

</body>
</html>
